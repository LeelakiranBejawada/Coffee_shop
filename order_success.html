<!DOCTYPE html>
<html>
<head>
    <title>Order Confirmed</title>
</head>
<body>
    <div class="card">
        <h1>🎉 Order Placed Successfully!</h1>
        <p><strong>Order ID:</strong> #{{ order_id }}</p>
        <p><strong>Item:</strong> {{ item }}</p>
        <p><strong>Quantity:</strong> {{ quantity }}</p>
        <p><strong>Topping:</strong> {{ topping }}</p>
        
        <div class="btn-container">
            <!-- Redirects back to the main Coffee Shop URL -->
            <a href="https://coffee-shop-w5su.onrender.com" class="btn btn-primary">Place Another Order</a>
            
            <!-- Closes the current browser tab -->
            <button onclick="window.close()" class="btn btn-secondary">Exit</button>
        </div>
    </div>
</body>
</html>
